site_name: CityPortraits
site_description: A project showcasing the architectural heritage of cities through portraits
site_url: https://greamarchitects.github.io/CityPortraits/
dev_addr: 127.0.0.1:8002

theme:
  name: material
  palette:
    scheme: default
    primary: white
    accent: blue
  features:
    - navigation.top
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.footer
    - search.highlight
    - toc.integrate

nav:
  - Home: index.md

  - Methodology:
      - Intro: methodology/index.md
      - Contextual Analysis: methodology/contextual_analysis/index.md
      - Spatial Analysis: methodology/spatial_analysis/index.md
      - Data Analysis: methodology/data_analysis/index.md

  - Model: model/index.md

  - Case Studies:
      - Overview: case_studies/index.md
      - Tirana: case_studies/Tirana.ipynb
      - Durrës: case_studies/Durres.ipynb
      - Berat: case_studies/Berat.ipynb
      - Shkodër: case_studies/Shkodra.ipynb

  - About: about/index.md

plugins:
  - search
  - mkdocs-jupyter:
      execute: false
      show_input: false
      include_source: false

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - md_in_html
  - pymdownx.details
  - pymdownx.snippets:
      base_path:
        - docs
      check_paths: true
  - toc:
      toc_depth: 3
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - https://unpkg.com/leaflet@1.9.4/dist/leaflet.css
  - stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/leaflet@1.9.4/dist/leaflet.js
  - https://unpkg.com/cytoscape/dist/cytoscape.min.js
  - https://unpkg.com/mermaid@10.6.1/dist/mermaid.min.js
  - javascripts/timeline-map.js
  - javascripts/graph.js
  - javascripts/spatial-dashboard.js

extra:
  generator: false
  footer:
    copyright: "© 2026 CityPortraits Team"
    custom: true
  meta:
    - name: google-site-verification
      content: "2_jAyfd8zpoIiuPrwYmkixpWFASajcOzTFl0KMrpJrE"
    - name: robots
      content: "index, follow"

exclude_docs: |
  **/*.gpkg
  **/*.zip
  **/*.parquet
  **/*.sqlite
  **/*.osm
  **/*.pbf
  assets/data/databases/GHSL_ALB/**
  assets/data/outputs/tirana_building_period_layers.gpkg