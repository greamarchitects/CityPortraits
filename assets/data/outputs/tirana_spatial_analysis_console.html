<script>
(function () {
  function waitForLeafletMap() {
    const mapElement = document.querySelector(".folium-map");
    if (!mapElement) {
      setTimeout(waitForLeafletMap, 100);
      return;
    }

    const mapId = mapElement.id;
    const map = window[mapId];

    if (!map || !map.eachLayer) {
      setTimeout(waitForLeafletMap, 100);
      return;
    }

    const namedLayers = {};

    map.eachLayer(function(layer) {
      if (layer.options && layer.options.name) {
        namedLayers[layer.options.name] = layer;
      }
    });

    document.querySelectorAll("[data-layer-name]").forEach(function(input) {
      const layerName = input.getAttribute("data-layer-name");
      const layer = namedLayers[layerName];

      if (!layer) {
        input.disabled = true;
        return;
      }

      map.removeLayer(layer);

      input.addEventListener("change", function() {
        if (input.checked) {
          map.addLayer(layer);
        } else {
          map.removeLayer(layer);
        }
      });
    });

    setTimeout(function () {
      map.invalidateSize();
    }, 300);
  }

  waitForLeafletMap();
})();
</script>
